name: Release meml

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in vMAJOR.MINOR.PATCH format"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.0-dev
        run: |
          ZIG_JSON=$(curl -fsSL https://ziglang.org/download/index.json)
          ZIG_VERSION=$(echo "$ZIG_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["master"]["version"])')
          ZIG_URL=$(echo "$ZIG_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["master"]["x86_64-linux"]["tarball"])')
          echo "Resolved Zig $ZIG_VERSION"
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "$PWD/zig-$ZIG_VERSION" >> "$GITHUB_PATH"
          export PATH=$PATH:$HOME/.local/bin
          ln -sf "$PWD/zig-$ZIG_VERSION/zig" $HOME/.local/bin/zig
          zig version
      - run: zig build test

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            asset: x86_64-linux
            archive: tar.gz
          - target: aarch64-linux-musl
            asset: aarch64-linux
            archive: tar.gz
          - target: x86_64-macos
            asset: x86_64-macos
            archive: tar.gz
          - target: aarch64-macos
            asset: aarch64-macos
            archive: tar.gz
          - target: x86_64-windows-gnu
            asset: x86_64-windows
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.0-dev
        run: |
          ZIG_JSON=$(curl -fsSL https://ziglang.org/download/index.json)
          ZIG_VERSION=$(echo "$ZIG_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["master"]["version"])')
          ZIG_URL=$(echo "$ZIG_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["master"]["x86_64-linux"]["tarball"])')
          echo "Resolved Zig $ZIG_VERSION"
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "$PWD/zig-$ZIG_VERSION" >> "$GITHUB_PATH"
          export PATH=$PATH:$HOME/.local/bin
          ln -sf "$PWD/zig-$ZIG_VERSION/zig" $HOME/.local/bin/zig
          zig version
      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Package meml
        env:
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist
          if [[ "$ASSET" == *windows* ]]; then
            binary="meml.exe"
          else
            binary="meml"
          fi
          cp "zig-out/bin/$binary" "dist/$binary"
          if [[ "$ARCHIVE" == "zip" ]]; then
            (cd dist && zip "meml-$ASSET.zip" "$binary")
          else
            tar -C dist -czf "dist/meml-$ASSET.tar.gz" "$binary"
          fi
          rm "dist/$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: meml-${{ matrix.asset }}
          path: dist/meml-${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble checksums
        run: |
          mkdir -p release
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release
          sha256sum meml-* > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$TARGET" --title "MEML CLI $TAG" --generate-notes
          fi
